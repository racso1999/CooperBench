<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 585" width="900" height="585" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title>Supervisor architecture with centralised integration</title>
  <desc>One supervisor allocates K features to N workers through a shared task list; workers publish their own branch to a shared git remote and never merge one another; the supervisor performs the single integration and submits one tree for evaluation.</desc>

  <defs>
    <marker id="aNavy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#12355b"/>
    </marker>
    <marker id="aAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b4530a"/>
    </marker>
    <marker id="aGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa3ad"/>
    </marker>
  </defs>

  <rect width="900" height="585" fill="#ffffff"/>

  <!-- ============ SUPERVISOR ============ -->
  <rect x="300" y="30" width="300" height="112" rx="8" fill="#e8eef6" stroke="#12355b" stroke-width="2"/>
  <text x="450" y="56" text-anchor="middle" font-size="17" font-weight="600" fill="#12355b">Supervisor (agent1)</text>
  <text x="450" y="75" text-anchor="middle" font-size="12" font-style="italic" fill="#4a6180">sole integrator</text>
  <text x="318" y="98" font-size="12.5" fill="#33475e">• reads all K feature specifications</text>
  <text x="318" y="115" font-size="12.5" fill="#33475e">• allocates features to workers</text>
  <text x="318" y="132" font-size="12.5" fill="#33475e">• merges every branch, submits result</text>

  <!-- ============ EVALUATOR ============ -->
  <rect x="720" y="34" width="170" height="80" rx="8" fill="#f6f6f4" stroke="#6b7280" stroke-width="1.4"/>
  <text x="805" y="58" text-anchor="middle" font-size="14.5" font-weight="600" fill="#374151">Evaluator</text>
  <text x="805" y="78" text-anchor="middle" font-size="11.5" fill="#5b6670">scores one tree against</text>
  <text x="805" y="94" text-anchor="middle" font-size="11.5" fill="#5b6670">all K held-out suites</text>

  <!-- arrow 5: supervisor -> evaluator -->
  <line x1="600" y1="62" x2="713" y2="62" stroke="#12355b" stroke-width="1.6" marker-end="url(#aNavy)"/>
  <circle cx="628" cy="62" r="10.5" fill="#12355b"/>
  <text x="628" y="66" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">5</text>
  <text x="660" y="82" text-anchor="middle" font-size="11" fill="#5b6670">submits one</text>
  <text x="660" y="96" text-anchor="middle" font-size="11" fill="#5b6670">integrated tree</text>

  <!-- arrow 1: supervisor -> lane A -->
  <line x1="410" y1="142" x2="410" y2="169" stroke="#12355b" stroke-width="1.6" marker-end="url(#aNavy)"/>
  <circle cx="410" cy="157" r="10.5" fill="#12355b"/>
  <text x="410" y="161" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">1</text>
  <text x="432" y="161" font-size="11.5" fill="#5b6670">writes PLAN.md and specs, assigns tasks</text>

  <!-- ============ LANE A: scratchpad + task list ============ -->
  <rect x="120" y="176" width="580" height="64" rx="6" fill="#f7f7f5" stroke="#b6b6ae" stroke-width="1.2"/>
  <text x="136" y="196" font-size="12.5" font-weight="600" fill="#4b5563">Shared scratchpad and task list</text>
  <rect x="136" y="205" width="112" height="26" rx="4" fill="#ffffff" stroke="#c9c9c1" stroke-width="1"/>
  <text x="192" y="222" text-anchor="middle" font-size="11" fill="#4b5563">PLAN.md</text>
  <rect x="258" y="205" width="184" height="26" rx="4" fill="#ffffff" stroke="#c9c9c1" stroke-width="1"/>
  <text x="350" y="222" text-anchor="middle" font-size="11" fill="#4b5563">specs/feature&lt;id&gt;.md</text>
  <rect x="452" y="205" width="130" height="26" rx="4" fill="#ffffff" stroke="#c9c9c1" stroke-width="1"/>
  <text x="517" y="222" text-anchor="middle" font-size="11" fill="#4b5563">assigned tasks</text>

  <!-- arrow 2: lane A -> workers -->
  <line x1="205" y1="240" x2="205" y2="271" stroke="#12355b" stroke-width="1.5" marker-end="url(#aNavy)"/>
  <line x1="410" y1="240" x2="410" y2="271" stroke="#12355b" stroke-width="1.5" marker-end="url(#aNavy)"/>
  <line x1="615" y1="240" x2="615" y2="271" stroke="#12355b" stroke-width="1.5" marker-end="url(#aNavy)"/>
  <circle cx="410" cy="256" r="10.5" fill="#12355b"/>
  <text x="410" y="260" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">2</text>
  <text x="432" y="260" font-size="11.5" fill="#5b6670">claims its assigned task</text>

  <!-- ============ WORKERS ============ -->
  <rect x="120" y="278" width="170" height="98" rx="8" fill="#f4f6f8" stroke="#5a7594" stroke-width="1.5"/>
  <text x="205" y="303" text-anchor="middle" font-size="14.5" font-weight="600" fill="#34495e">Worker (agent2)</text>
  <text x="205" y="325" text-anchor="middle" font-size="11" fill="#5b6670">own container</text>
  <text x="205" y="341" text-anchor="middle" font-size="11" fill="#5b6670">own clone of the repo</text>
  <text x="205" y="357" text-anchor="middle" font-size="11" fill="#5b6670">starts with no spec</text>

  <rect x="325" y="278" width="170" height="98" rx="8" fill="#f4f6f8" stroke="#5a7594" stroke-width="1.5"/>
  <text x="410" y="303" text-anchor="middle" font-size="14.5" font-weight="600" fill="#34495e">Worker (agent3)</text>
  <text x="410" y="325" text-anchor="middle" font-size="11" fill="#5b6670">own container</text>
  <text x="410" y="341" text-anchor="middle" font-size="11" fill="#5b6670">own clone of the repo</text>
  <text x="410" y="357" text-anchor="middle" font-size="11" fill="#5b6670">starts with no spec</text>

  <rect x="530" y="278" width="170" height="98" rx="8" fill="#f4f6f8" stroke="#5a7594" stroke-width="1.5" stroke-dasharray="7 4"/>
  <text x="615" y="303" text-anchor="middle" font-size="14.5" font-weight="600" fill="#34495e">Worker (agentN)</text>
  <text x="615" y="325" text-anchor="middle" font-size="11" fill="#5b6670">own container</text>
  <text x="615" y="341" text-anchor="middle" font-size="11" fill="#5b6670">own clone of the repo</text>
  <text x="615" y="357" text-anchor="middle" font-size="11" fill="#5b6670">starts with no spec</text>

  <!-- arrow 3: workers -> lane B -->
  <line x1="205" y1="376" x2="205" y2="409" stroke="#12355b" stroke-width="1.5" marker-end="url(#aNavy)"/>
  <line x1="410" y1="376" x2="410" y2="409" stroke="#12355b" stroke-width="1.5" marker-end="url(#aNavy)"/>
  <line x1="615" y1="376" x2="615" y2="409" stroke="#12355b" stroke-width="1.5" marker-end="url(#aNavy)"/>
  <circle cx="410" cy="393" r="10.5" fill="#12355b"/>
  <text x="410" y="397" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">3</text>
  <text x="432" y="397" font-size="11.5" fill="#5b6670">pushes its own branch only</text>

  <!-- ============ LANE B: shared git remote ============ -->
  <rect x="120" y="414" width="580" height="96" rx="6" fill="#f7f7f5" stroke="#b6b6ae" stroke-width="1.2"/>
  <text x="136" y="436" font-size="12.5" font-weight="600" fill="#4b5563">Shared git remote (bare)</text>

  <rect x="150" y="452" width="110" height="34" rx="4" fill="#ffffff" stroke="#c9c9c1" stroke-width="1"/>
  <text x="205" y="473" text-anchor="middle" font-size="11.5" fill="#4b5563">branch agent2</text>
  <rect x="355" y="452" width="110" height="34" rx="4" fill="#ffffff" stroke="#c9c9c1" stroke-width="1"/>
  <text x="410" y="473" text-anchor="middle" font-size="11.5" fill="#4b5563">branch agent3</text>
  <rect x="560" y="452" width="110" height="34" rx="4" fill="#ffffff" stroke="#c9c9c1" stroke-width="1"/>
  <text x="615" y="473" text-anchor="middle" font-size="11.5" fill="#4b5563">branch agentN</text>

  <!-- crossed-out sideways merges: the point of the figure -->
  <line x1="268" y1="469" x2="347" y2="469" stroke="#9aa3ad" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="300" y1="461" x2="316" y2="477" stroke="#8a3324" stroke-width="2.2"/>
  <line x1="316" y1="461" x2="300" y2="477" stroke="#8a3324" stroke-width="2.2"/>
  <line x1="473" y1="469" x2="552" y2="469" stroke="#9aa3ad" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="505" y1="461" x2="521" y2="477" stroke="#8a3324" stroke-width="2.2"/>
  <line x1="521" y1="461" x2="505" y2="477" stroke="#8a3324" stroke-width="2.2"/>

  <!-- arrow 4: lane B -> supervisor (the single integration) -->
  <path d="M 120 462 L 62 462 L 62 110 L 293 110" fill="none" stroke="#b4530a" stroke-width="2.6" marker-end="url(#aAccent)"/>
  <circle cx="62" cy="146" r="10.5" fill="#b4530a"/>
  <text x="62" y="150" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">4</text>
  <text x="52" y="310" text-anchor="middle" font-size="12" font-weight="600" fill="#b4530a" transform="rotate(-90 52 310)">fetches and merges every worker branch</text>

  <!-- ============ CALLOUT: the point of the figure ============ -->
  <rect x="716" y="414" width="176" height="96" rx="6" fill="#fbf3f1" stroke="#8a3324" stroke-width="1.3"/>
  <line x1="796" y1="430" x2="812" y2="446" stroke="#8a3324" stroke-width="2.4"/>
  <line x1="812" y1="430" x2="796" y2="446" stroke="#8a3324" stroke-width="2.4"/>
  <text x="804" y="466" text-anchor="middle" font-size="11.5" font-weight="600" fill="#8a3324">Workers never merge</text>
  <text x="804" y="481" text-anchor="middle" font-size="11.5" font-weight="600" fill="#8a3324">one another: the team</text>
  <text x="804" y="496" text-anchor="middle" font-size="11.5" font-weight="600" fill="#8a3324">integrates exactly once.</text>

  <!-- ============ NOTES ============ -->
  <text x="470" y="546" text-anchor="middle" font-size="11.5" fill="#5b6670">N workers and one supervisor; a run is reported at N + 1 agents.</text>
  <text x="470" y="566" text-anchor="middle" font-size="11.5" fill="#5b6670">The message bus is unchanged: any agent may address any other directly, so the hierarchy is in the brief rather than the wiring.</text>
</svg>
